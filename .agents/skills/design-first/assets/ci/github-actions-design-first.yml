name: DesignFirst integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  design-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Audit design-system boundary
        run: >-
          node scripts/design-first/cli.mjs --json

      - name: Validate ready and approved registry
        run: >-
          node scripts/design-first/cli.mjs validate-registry docs/design-system.registry.json --require-ready --require-approved

      - name: JavaScript repository checks
        run: |
          corepack pnpm lint
          corepack pnpm test
          corepack pnpm build
