http:
  middlewares:
    edge-admin-network:
      ipAllowList:
        sourceRange:
          - "100.64.0.0/10"
          - "172.19.143.157/32"
          - "172.19.143.158/32"
          - "127.0.0.1/32"
          - "::1/128"
    edge-admin-access:
      chain:
        middlewares:
          - edge-admin-network
  routers:
    edge-traefik-dashboard:
      rule: "Host(`traefik.superfx.cn`)"
      priority: 100
      service: api@internal
      middlewares:
        - edge-admin-access
