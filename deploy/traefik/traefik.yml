global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

ping: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    asDefault: true
    http:
      tls:
        certResolver: superfx
        domains:
          - main: superfx.cn
            sans:
              - "*.superfx.cn"
    transport:
      respondingTimeouts:
        readTimeout: "600s"
        writeTimeout: "600s"
        idleTimeout: "180s"
      lifeCycle:
        requestAcceptGraceTimeout: "10s"
        graceTimeOut: "10s"
  verification:
    address: "127.0.0.1:8081"
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  superfx:
    acme:
      email: __PROJECTWING_TRAEFIK_ACME_EMAIL__
      storage: /acme/acme.json
      dnsChallenge:
        provider: alidns
        resolvers:
          - "223.5.5.5:53"
          - "223.6.6.6:53"

log:
  level: INFO
  format: common

accessLog:
  format: json
  bufferingSize: 100
