<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Mainland Chinese Microsoft Office font families. -->
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>AR PL SungtiL GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong_GB2312</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi</family>
    <prefer><family>AR PL KaitiM GB</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体</family>
    <prefer><family>AR PL KaitiM GB</family></prefer>
  </alias>

  <!-- Traditional Chinese Microsoft Office font families. -->
  <alias binding="same">
    <family>MingLiU</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>
  <alias binding="same">
    <family>PMingLiU</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>
  <alias binding="same">
    <family>新細明體</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>
  <alias binding="same">
    <family>細明體</family>
    <prefer><family>AR PL UMing TW</family></prefer>
  </alias>

  <!-- Metric-compatible Latin families available under open licenses. -->
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Monotype Corsiva</family>
    <prefer><family>Z003</family></prefer>
  </alias>
</fontconfig>
