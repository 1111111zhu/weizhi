name: Verify self-hosted runner

on:
  push:
    branches:
      - "validation/**"
    paths:
      - "apps/emp/**"
      - "packages/shared/**"
      - ".github/workflows/runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-emp-branch:
    name: Validate EMP branch
    if: github.event_name == 'push'
    runs-on: ${{ vars.PROJECTWING_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.5.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        env:
          COREPACK_ENABLE_PROJECT_SPEC: "0"
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --config.verify-deps-before-run=false install --frozen-lockfile

      - name: Build shared package
        run: pnpm --config.verify-deps-before-run=false --filter @project-wing/shared build

      - name: Resolve associated pull request
        id: resolve-pr
        shell: bash
        run: |
          pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --head "${GITHUB_REF_NAME}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          if [ -z "${pr_number}" ]; then
            echo "No open pull request is associated with ${GITHUB_REF_NAME}."
          else
            echo "Associated pull request: #${pr_number}"
          fi

      - name: Run EMP TypeScript check
        id: emp-lint
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
        run: |
          set +e
          log_file="${RUNNER_TEMP}/emp-lint.log"
          pnpm --config.verify-deps-before-run=false --filter @project-wing/emp lint >"${log_file}" 2>&1
          status=$?
          cat "${log_file}"
          if [ "${status}" -ne 0 ] && [ -n "${PR_NUMBER}" ]; then
            {
              echo "### EMP TypeScript failed"
              echo
              echo '```text'
              tail -n 160 "${log_file}"
              echo '```'
            } > "${RUNNER_TEMP}/emp-lint-comment.md"
            gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/emp-lint-comment.md"
          fi
          exit "${status}"

      - name: Run EMP full test suite
        id: emp-full-tests
        continue-on-error: true
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
        run: |
          set +e
          log_file="${RUNNER_TEMP}/emp-full-tests.log"
          pnpm --config.verify-deps-before-run=false --filter @project-wing/emp test >"${log_file}" 2>&1
          status=$?
          cat "${log_file}"
          if [ "${status}" -ne 0 ] && [ -n "${PR_NUMBER}" ]; then
            {
              echo "### EMP full tests failed"
              echo
              echo '```text'
              tail -n 240 "${log_file}"
              echo '```'
            } > "${RUNNER_TEMP}/emp-full-tests-comment.md"
            gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/emp-full-tests-comment.md"
          fi
          exit "${status}"

      - name: Publish validation result
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ steps.resolve-pr.outputs.number }}
        run: |
          lint_outcome="${{ steps.emp-lint.outcome }}"
          full_outcome="${{ steps.emp-full-tests.outcome }}"
          {
            echo "### EMP validation result"
            echo
            echo "- TypeScript: ${lint_outcome}"
            echo "- EMP full tests: ${full_outcome}"
          } > "${RUNNER_TEMP}/emp-validation-result.md"
          if [ -n "${PR_NUMBER}" ]; then
            gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/emp-validation-result.md"
          fi
          test "${lint_outcome}" = "success"
          test "${full_outcome}" = "success"

  verify-linux-runner:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.PROJECTWING_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v6
        env:
          COREPACK_ENABLE_PROJECT_SPEC: "0"
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: "8.0.x"

      - name: Install dependencies
        run: pnpm --config.verify-deps-before-run=false install --frozen-lockfile

      - name: Verify runner toolchain
        shell: bash
        run: |
          docker version --format '{{.Server.Version}}'
          pwsh --version
          gh --version
          corepack pnpm --filter @project-wing/shared build

      - name: Cross-build Windows Desktop Agent
        shell: bash
        run: |
          pwsh -File scripts/desktop-agent/build-windows-installer.ps1 -Version "0.0.0"
          test -s output/desktop-agent/windows/desktop-agent-win-x64-0.0.0.exe
